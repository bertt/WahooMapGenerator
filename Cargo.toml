[package]
name = "wahoo-map-generator"
version = "0.1.0"
edition = "2024"

[lib]
name = "wahoo_map"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "wahoo-map-generator"
required-features = ["native"]

[[example]]
name = "area_thresholds"
required-features = ["native"]

[features]
default = ["native"]
# Command line tool and Geofabrik download; switched off for the WebAssembly build.
native = ["dep:clap", "dep:serde_json", "dep:ureq"]

[dependencies]
anyhow = "1.0.104"
flate2 = "1.1.10"
lzma-rust2 = { version = "0.24.0", default-features = false, features = ["std", "encoder"] }
prost = "0.14.4"
clap = { version = "4.6.7", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
ureq = { version = "3.5.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
